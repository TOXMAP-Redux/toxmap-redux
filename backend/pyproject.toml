# backend/pyproject.toml
[project]
name = "toxmap-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.51",
    "geoalchemy2==0.17.0",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.8.0",
    "httpx==0.28.1",
    "python-dotenv==1.1.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
ingestion = [
    "geopandas==1.0.1",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "requests==2.32.3",
    "shapely==2.0.7",
]
test = [
    "pytest==8.4.0",
    "pytest-bdd==8.1.0",
    "pytest-asyncio==0.25.3",
    "pytest-benchmark==5.1.0",
    "pytest-cov==6.1.1",
    "pytest-rerunfailures==15.0",
    "psycopg2-binary==2.9.10",
    "playwright==1.52.0",
    "pytest-playwright==0.7.0",
    "schemathesis==3.39.14",
    "mutmut==3.2.0",
]
# dev = test + linting tools; used by CI: pip install -e ".[dev]"
# Self-referential: toxmap-backend[test] resolves the test extras of this package.
# pip 21.2+ supports self-referential extras when installed with -e (editable mode).
dev = [
    "toxmap-backend[test]",
    "ruff==0.11.0",
    "mypy==1.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false  # FastAPI decorators are typed as Callable[..., Any]

# GeoAlchemy2 geometry columns are typed as `object` without stubs
# Starlette middleware typing is overly strict for custom middleware classes
[[tool.mypy.overrides]]
module = [
    "app.services.facility_service",
    "app.services.superfund_service",
    "app.services.demographics_service",
    "app.services.chemical_service",
    "app.routers.layers",
    "app.routers.facilities",
    "app.routers.superfund",
    "app.routers.demographics",
    "app.routers.chemicals",
    "app.routers.export",
    "app.main",
]
disable_error_code = ["arg-type", "call-overload", "attr-defined"]

# SQLAlchemy model forward references
[[tool.mypy.overrides]]
module = [
    "app.models.release_event",
    "app.models.chemical_family",
    "app.models.chemical",
    "app.models.facility",
    "app.models.superfund_site",
    "app.models.county_demographics",
]
disable_error_code = ["name-defined"]

# Ingestion scripts with dynamic DB connections
[[tool.mypy.overrides]]
module = [
    "ingestion.superfund_ingest",
    "ingestion.census_ingest",
    "ingestion.tri_ingest",
    "ingestion.tri_parser",
]
disable_error_code = ["attr-defined", "arg-type", "unused-ignore", "import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# V10-D: working-directory=backend in CI so this file is discovered by pytest.
# V10-G: --cov=app --cov-report=xml generates the coverage report consumed by Codecov.
addopts = "-p no:xdist --base-url http://localhost:3000 --screenshot only-on-failure --cov=app --cov-report=xml:../reports/coverage.xml"
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

[tool.alembic]
script_location = "alembic"

# ═══════════════════════════════════════════════════════════════════════════════
# Mutation Testing (mutmut) — Audit Finding V14-7
# Run with: mutmut run --paths-to-mutate=app/services/
# View results: mutmut results
# ═══════════════════════════════════════════════════════════════════════════════
[tool.mutmut]
paths_to_mutate = "app/services/"
tests_dir = "../tests/unit/"
runner = "pytest -x -q --tb=no"
# Exclude slow/integration tests from mutation runs
dict_synonyms = "Struct, NamedStuple"
# Skip mutations in config files and __init__.py
disable_mutation_types = "annotation"
