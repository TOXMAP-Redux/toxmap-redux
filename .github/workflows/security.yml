# TOXMAP — Security Scanning
#
# Runs on every PR and every push to main.
# Security tooling matrix (GOVERNANCE.md §8 "Security Tooling (CI-Enforced)"):
#
#   gitleaks  — secret detection (every PR + push)
#   pip-audit — Python CVE audit, fails on Critical/High (every PR + push)
#   npm audit — JS CVE audit, fails on high/critical (every PR + push)
#   bandit    — Python SAST (every PR + push)
#   semgrep   — OWASP Top 10 (Phase 6+ PRs; continue-on-error until then)
#
# Action pinning: replace @vX tags with full 40-char SHAs per
# docs/security/PINNED_ACTIONS.md (story 0.5.4) before production use.
#
# Suppressed findings: docs/security/FINDINGS_REGISTER.md
# Accepted risks:      docs/security/ACCEPTED_RISKS.md

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # needed by all jobs to checkout
  security-events: write  # needed by gitleaks and semgrep to upload SARIF

# ═══════════════════════════════════════════════════════════════════════════════
# Job: gitleaks — Secret Scanning
# Detects committed secrets / credentials throughout the entire git history.
# Failure condition: any detected secret pattern.
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  gitleaks:
    name: "Secret Scanning (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for org-level scans; not needed here.

# ═══════════════════════════════════════════════════════════════════════════════
# Job: pip-audit — Python Dependency CVE Audit
# Failure condition: any Critical or High CVE in backend dependencies.
# CVE SLA: Critical ≤ 48 h, High ≤ 7 days (GOVERNANCE.md §8).
# ═══════════════════════════════════════════════════════════════════════════════
  pip-audit:
    name: "Python Dependency Audit (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install backend dependencies (for accurate dependency graph)
        run: pip install -e ".[dev,ingestion]"
        working-directory: backend

      - name: Audit Python dependencies
        # Fails on CRITICAL or HIGH CVEs; Medium/Low addressed in next scheduled release.
        run: pip-audit --strict --output=json --output-file=pip-audit-report.json || \
               (cat pip-audit-report.json && exit 1)
        working-directory: backend

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════════════
# Job: npm-audit — JavaScript Dependency CVE Audit
# Failure condition: any High or Critical vulnerability in frontend dependencies.
# ═══════════════════════════════════════════════════════════════════════════════
  npm-audit:
    name: "JS Dependency Audit (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

# ═══════════════════════════════════════════════════════════════════════════════
# Job: bandit — Python SAST
# Failure condition: any Medium+ finding not in docs/security/FINDINGS_REGISTER.md.
# B101 (assert-used) is skipped project-wide; test code assertions are expected.
# ═══════════════════════════════════════════════════════════════════════════════
  bandit:
    name: "Python SAST (bandit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # -ll = report Medium and High only (matching governance §8 "Medium+ finding" gate)
        # --skip B101 = allow assert statements (test code)
        # --exit-zero for bandit; actual gate is set by -ll and finding count check
        run: |
          bandit -r backend/app backend/ingestion \
            -ll \
            --skip B101 \
            -f json \
            -o bandit-report.json \
            || true
          # Fail if any medium+ issues found (after suppression allow-list)
          python - <<'EOF'
          import json, sys
          with open("bandit-report.json") as f:
              report = json.load(f)
          issues = [
              i for i in report.get("results", [])
              if i["issue_severity"] in ("MEDIUM", "HIGH", "CRITICAL")
          ]
          if issues:
              for i in issues:
                  print(f"[{i['issue_severity']}] {i['issue_text']} — {i['filename']}:{i['line_number']}")
              print(f"\n{len(issues)} medium+ issue(s) found.")
              print("To suppress a finding, add it to docs/security/FINDINGS_REGISTER.md")
              print("with a justification, then add a '# nosec BXxx' comment inline.")
              sys.exit(1)
          else:
              print("bandit: no medium+ issues found.")
          EOF

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════════════
# Job: semgrep — OWASP Top 10 Static Analysis (Phase 6+)
# Failure condition: any High or Critical finding not in FINDINGS_REGISTER.md.
# continue-on-error: true until Phase 6 is reached (story 6.x security hardening).
# See GOVERNANCE.md §8 and agents/security-engineer/prompt.md §Phase 6.
# ═══════════════════════════════════════════════════════════════════════════════
  semgrep:
    name: "OWASP Top 10 (semgrep) [Phase 6+]"
    runs-on: ubuntu-latest
    # continue-on-error: true  # Uncomment until Phase 6 security stories are complete.
    # TODO(phase-6): remove continue-on-error and enforce as a hard gate.
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run semgrep OWASP Top 10
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/python" \
            --error \
            --json \
            --output semgrep-report.json \
            backend/app backend/ingestion
        # Any High or Critical finding that is not suppressed with '# nosemgrep'
        # and documented in docs/security/FINDINGS_REGISTER.md will fail this job.

      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

